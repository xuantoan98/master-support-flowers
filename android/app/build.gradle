plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    keystoreProperties[it]
} && file(keystoreProperties['storeFile']).exists()
android {
    namespace = "masterx.support.flowers"


    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }


    defaultConfig {
        applicationId "masterx.support.flowers"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode 100
        versionName '1.0.0'
        multiDexEnabled true
        ndk.abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
    }


    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile hasReleaseKey ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Bản dev được phép rơi về debug key để cài thử trên máy; bản prod thì không
            // (xem kiểm tra taskGraph ở cuối file).
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
// Chặn build prod release khi thiếu khóa ký thật: APK/AAB ký bằng debug key
// không cập nhật được bằng key thật về sau và ai cũng ký giả được.
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKey && graph.allTasks.any { it.project == project && it.name.contains('ProdRelease') }) {
        throw new GradleException(
            'Thiếu khóa ký release: cần android/key.properties với storeFile, storePassword, ' +
            'keyAlias, keyPassword và file keystore tồn tại. Không build prod release bằng debug key.')
    }
}

