flavors:
  dev:
    app:
      name: "Sổ Hoa Dev"

    android:
      applicationId: "masterx.support.flowers.dev"
      icon: "assets/images/logo/rounded_logo_dev.png"
      firebase:
        config: "android/app/src/dev/google-services.json"
    ios:
      bundleId: "masterx.support.flowers.dev"
      icon: "assets/images/logo/logo_dev.png"
      firebase:
        config: "ios/Runner/dev/GoogleService-Info.plist"

  prod:
    app:
      name: "Sổ Hoa"
    android:
      applicationId: "masterx.support.flowers"
      icon: "assets/images/logo/rounded_logo.png"
      firebase:
        config: "android/app/src/prod/google-services.json"
    ios:
      bundleId: "masterx.support.flowers"
      icon: "assets/images/logo/logo.png"
      firebase:
        config: "ios/Runner/prod/GoogleService-Info.plist"