name: flower_orders
description: Offline flower shop order manager.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.13
  image_picker: ^1.2.4
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^11.1.0
  sqflite: ^2.4.2
  timezone: ^0.11.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
  assets:
    - assets/flowers/placeholders/
